<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hundrennen Bingo</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Hunderennen Bingo</h1>
        <p>Klicke auf die Hunderassen, die du gesehen hast!</p>

        <div class="bingo-board">
            <!-- Bingo cards will be inserted here by JavaScript -->
        </div>

        <button id="reset-button" class="reset-button">Neues Spiel</button>

        <div id="congratulations" class="hidden">
            <h2>Glückwunsch!</h2>
            <p>Du hast eine Reihe voll!</p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
